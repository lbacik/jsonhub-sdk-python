[tool.poetry]
name = "jsonhub-sdk"
version = "1.0.0"
description = "A client library for accessing JsonHub API"
authors = [ "Łukasz Bacik <mail@luka.sh>" ]
readme = "README.md"
include = [ "CHANGELOG.md", "jsonhub_sdk/py.typed" ]
license = "MIT"
repository = "https://github.com/lbacik/jsonhub-sdk-python"
keywords = [ "jsonhub", "sdk", "openapi", "python", "api-client" ]

[[tool.poetry.packages]]
include = "jsonhub_sdk"

[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.23.0,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [ "F", "I", "UP" ]

[tool.jsonhub]
source_api_version = "v0.11.0"

[build-system]
requires = [ "poetry-core>=2.0.0,<3.0.0" ]
build-backend = "poetry.core.masonry.api"
